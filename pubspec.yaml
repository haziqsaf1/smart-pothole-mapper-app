name: main_app_spm
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # --- Added for PDF Report Generation ---
  pdf: ^3.11.1
  printing: ^5.13.2

  # --- Added for the GMI Campus Hazard Monitor app ---

  # Firebase (Realtime Database "Map-API")
  firebase_core: ^3.15.2
  firebase_database: ^11.0.0
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12

  # Map tab: OpenStreetMap tiles, no API key required
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

  # Map tab: live "My Phone" GPS marker
  geolocator: ^14.0.3

  # Repairs: date + time formatting
  intl: ^0.20.2

  firebase_storage: ^12.0.0
  image_picker: ^1.0.0
  flutter_local_notifications: ^17.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

dependency_overrides:
  # pdf currently constrains archive below the version required by image 4.11.
  image: 4.8.0

flutter:
  uses-material-design: true

  # Assets configuration for GMI Logo
  assets:
    - assets/images/gmi_logo.png